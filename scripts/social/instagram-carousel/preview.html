<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Green Line V3 — Carousel Preview</title>
  <style>
    :root {
      --bg: #111;
      --panel: #1a1a1a;
      --lime: #39ff14;
      --text: #f5f5f5;
      --muted: #a3a3a3;
      --border: #333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      display: grid;
      grid-template-columns: 280px 1fr;
    }

    aside {
      border-right: 1px solid var(--border);
      background: var(--panel);
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
    }

    h1 span { color: var(--lime); }

    .hint {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav button {
      appearance: none;
      border: 1px solid var(--border);
      background: #0f0f0f;
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      text-align: left;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      transition: border-color 0.2s, transform 0.15s;
    }

    .nav button:hover {
      border-color: #555;
      transform: translateY(-1px);
    }

    .nav button.active {
      border-color: var(--lime);
      box-shadow: 0 0 0 1px rgba(57, 255, 20, 0.25);
    }

    .nav button small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .actions a,
    .actions button {
      display: block;
      text-align: center;
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 14px;
      color: var(--text);
      background: #0f0f0f;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .actions a.primary,
    .actions button.primary {
      background: var(--lime);
      color: #000;
      border-color: var(--lime);
      font-weight: 700;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px;
      min-height: 100vh;
    }

    .stage-wrap {
      position: relative;
      width: min(432px, 42vw);
      aspect-ratio: 1080 / 1350;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      background: #000;
    }

    .stage-wrap iframe {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1350px;
      border: 0;
      transform-origin: top left;
      /* scale set by JS */
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .controls button {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      width: 44px;
      height: 44px;
      font-size: 20px;
      cursor: pointer;
    }

    .controls button:hover { border-color: var(--lime); }

    .label {
      min-width: 180px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    .label strong {
      display: block;
      color: var(--text);
      font-size: 16px;
      margin-bottom: 2px;
    }

    .path {
      font-size: 12px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      max-width: 560px;
      text-align: center;
      word-break: break-all;
    }

    @media (max-width: 900px) {
      body { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <aside>
    <div>
      <h1>Green Line <span>V3</span><br />Carousel Preview</h1>
      <p class="hint" style="margin-top: 10px;">
        Edit the HTML files in <code>slides/</code>, then refresh this page.
        Export PNGs with the command below.
      </p>
    </div>

    <div class="nav" id="nav"></div>

    <div class="actions">
      <a class="primary" id="editLink" href="#" target="_blank" rel="noopener">Open current HTML</a>
      <button type="button" id="copyCmd">Copy export command</button>
      <p class="hint">
        <code>node scripts/social/instagram-carousel/export.mjs</code>
      </p>
    </div>
  </aside>

  <main>
    <div class="stage-wrap" id="stage">
      <iframe id="frame" title="Slide preview"></iframe>
    </div>

    <div class="controls">
      <button type="button" id="prev" aria-label="Previous slide">←</button>
      <div class="label">
        <strong id="title">Slide</strong>
        <span id="counter">1 / 3</span>
      </div>
      <button type="button" id="next" aria-label="Next slide">→</button>
    </div>

    <p class="path" id="path"></p>
  </main>

  <script>
    const slides = [
      {
        id: '1',
        title: 'Slide 1 — Hook',
        file: 'slides/v3-slide1-hook.html',
        blurb: 'Steal these 2 sentences',
      },
      {
        id: '2',
        title: 'Slide 2 — Visual',
        file: 'slides/v3-slide2-figures.html',
        blurb: 'Figures + feel sentences',
      },
      {
        id: '3',
        title: 'Slide 3 — CTA',
        file: 'slides/v3-slide3-cta.html',
        blurb: 'Save & share',
      },
    ]

    let index = 0
    const frame = document.getElementById('frame')
    const stage = document.getElementById('stage')
    const titleEl = document.getElementById('title')
    const counterEl = document.getElementById('counter')
    const pathEl = document.getElementById('path')
    const editLink = document.getElementById('editLink')
    const nav = document.getElementById('nav')

    function scaleFrame() {
      const scale = stage.clientWidth / 1080
      frame.style.transform = `scale(${scale})`
    }

    function renderNav() {
      nav.innerHTML = slides.map((s, i) => `
        <button type="button" data-i="${i}" class="${i === index ? 'active' : ''}">
          ${s.title}
          <small>${s.blurb}</small>
        </button>
      `).join('')
      nav.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => {
          index = Number(btn.dataset.i)
          show()
        })
      })
    }

    function show() {
      const s = slides[index]
      frame.src = s.file
      titleEl.textContent = s.title
      counterEl.textContent = `${index + 1} / ${slides.length}`
      pathEl.textContent = s.file
      editLink.href = s.file
      renderNav()
      scaleFrame()
    }

    document.getElementById('prev').onclick = () => {
      index = (index - 1 + slides.length) % slides.length
      show()
    }
    document.getElementById('next').onclick = () => {
      index = (index + 1) % slides.length
      show()
    }

    document.getElementById('copyCmd').onclick = async () => {
      const cmd = 'node scripts/social/instagram-carousel/export.mjs'
      await navigator.clipboard.writeText(cmd)
      const btn = document.getElementById('copyCmd')
      btn.textContent = 'Copied!'
      setTimeout(() => { btn.textContent = 'Copy export command' }, 1200)
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') document.getElementById('next').click()
      if (e.key === 'ArrowLeft') document.getElementById('prev').click()
    })

    window.addEventListener('resize', scaleFrame)
    show()
  </script>
</body>
</html>
