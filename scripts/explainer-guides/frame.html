<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }
  .frame {
    width: 1920px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Poppins', sans-serif;
  }
  .glow-a, .glow-b {
    position: absolute;
    width: 1200px;
    height: 1200px;
    border-radius: 50%;
    filter: blur(180px);
    opacity: 0.13;
  }
  .glow-a { background: var(--accent, #39FF14); top: -600px; left: -400px; }
  .glow-b { background: #BF00FF; bottom: -700px; right: -400px; opacity: 0.10; }

  .topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 96px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 64px;
    z-index: 3;
  }
  .topbar img { height: 34px; }
  .area-pill {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 2px solid var(--accent, #39FF14);
    color: var(--accent, #39FF14);
    border-radius: 9999px;
    padding: 10px 28px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .area-pill .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent, #39FF14);
    box-shadow: 0 0 12px var(--accent, #39FF14);
  }

  .shot-wrap {
    position: absolute;
    top: 110px;
    left: 50%;
    transform: translateX(-50%);
    width: 1420px;
    height: 799px;
    border-radius: 24px;
    border: 2px solid #333;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 60px color-mix(in srgb, var(--accent, #39FF14) 12%, transparent);
    z-index: 2;
    background: #111;
  }
  .shot-wrap img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: top; }

  .highlight {
    position: absolute;
    border: 4px solid var(--accent, #39FF14);
    border-radius: 14px;
    box-shadow: 0 0 0 4000px rgba(0,0,0,0.32), 0 0 28px var(--accent, #39FF14);
    z-index: 5;
  }

  .caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 150px;
    display: flex;
    align-items: center;
    gap: 32px;
    padding: 0 72px;
    z-index: 4;
    background: linear-gradient(to top, rgba(0,0,0,0.92), rgba(0,0,0,0.55) 70%, transparent);
  }
  .step-badge {
    flex-shrink: 0;
    width: 92px; height: 92px;
    border-radius: 50%;
    background: var(--accent, #39FF14);
    color: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    box-shadow: 0 0 40px color-mix(in srgb, var(--accent, #39FF14) 55%, transparent);
  }
  .step-badge .lbl { font-size: 13px; letter-spacing: 0.18em; font-weight: 700; }
  .step-badge .num { font-size: 40px; line-height: 1; }
  .cap-text h1 {
    color: #fff;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  .cap-text p {
    color: #c9c9c9;
    font-size: 22px;
    font-weight: 400;
    max-width: 1500px;
  }
  .footer-url {
    position: absolute;
    right: 72px;
    bottom: 56px;
    color: #555;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.08em;
    z-index: 5;
  }
</style>
</head>
<body>
  <div class="frame" id="frame">
    <div class="glow-a"></div>
    <div class="glow-b"></div>
    <div class="topbar">
      <img id="logo" src="https://media.vibrationfit.com/site-assets/brand/logo/logo-white.svg" />
      <div class="area-pill"><span class="dot"></span><span id="area"></span></div>
    </div>
    <div class="shot-wrap" id="shotwrap">
      <img id="shot" src="" />
      <div class="highlight" id="highlight" style="display:none"></div>
    </div>
    <div class="caption">
      <div class="step-badge"><span class="lbl">STEP</span><span class="num" id="stepnum"></span></div>
      <div class="cap-text">
        <h1 id="title"></h1>
        <p id="desc"></p>
      </div>
    </div>
    <div class="footer-url">vibrationfit.com</div>
  </div>
  <script>
    // Populated by composite.js via window.renderStep(data)
    window.renderStep = function (d) {
      document.documentElement.style.setProperty('--accent', d.accent || '#39FF14')
      document.getElementById('area').textContent = d.area
      document.getElementById('stepnum').textContent = d.step
      document.getElementById('title').textContent = d.title
      document.getElementById('desc').textContent = d.desc || ''
      document.getElementById('shot').src = d.image

      const hl = document.getElementById('highlight')
      if (d.box) {
        // box is in CSS px relative to a 1920x1080 raw capture; the raw image is
        // object-fit: cover / top inside a 1420x799 wrapper (same 16:9 ratio).
        const sx = 1420 / 1920
        const sy = 799 / 1080
        const pad = 8
        hl.style.display = 'block'
        hl.style.left = (d.box.x * sx - pad) + 'px'
        hl.style.top = (d.box.y * sy - pad) + 'px'
        hl.style.width = (d.box.w * sx + pad * 2) + 'px'
        hl.style.height = (d.box.h * sy + pad * 2) + 'px'
      } else {
        hl.style.display = 'none'
      }
      return new Promise((resolve) => {
        const img = document.getElementById('shot')
        if (img.complete) resolve()
        else img.onload = () => resolve()
      })
    }
  </script>
</body>
</html>
